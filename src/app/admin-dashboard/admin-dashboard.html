<div class="h-screen flex flex-col overflow-hidden" style="background: #ffffff">
  <!-- Top Navbar -->
  <nav
    class="text-white shadow-lg shrink-0 sticky top-0 z-30"
    style="background: linear-gradient(135deg, #1e80a3 0%, #155a7a 50%, #f79425 100%)"
  >
    <div
      class="flex items-center justify-between px-3 md:px-6 py-3 md:py-4 flex-wrap md:flex-nowrap gap-2 md:gap-0"
    >
      <div class="flex items-center gap-2 md:gap-3">
        <button
          (click)="toggleSidebar()"
          class="p-2 hover:bg-orange-400 hover:bg-opacity-20 rounded-lg transition duration-200"
        >
          <svg
            class="w-5 h-5 md:w-6 md:h-6 text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
        <span class="text-sm md:text-xl font-bold">{{ userRole }} PANEL</span>
      </div>

      <div class="flex items-center gap-2 md:gap-4">
        <span class="material-icons">person</span>
        <span class="text-sm md:text-base font-semibold text-white">{{ fullName }}</span>
        <button
          (click)="logout()"
          class="px-3 md:px-4 py-2 rounded-lg text-white font-semibold shadow-md transition duration-200 hover:opacity-90"
          style="background: #dc2626"
        >
          <!-- Logout -->
          <span class="material-icons py-0.6">logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="flex flex-1 min-h-0 overflow-hidden">
    <!-- Left Sidebar -->
    <aside
      class="shadow-lg transition-all duration-300 h-full shrink-0"
      [class.w-64]="isSidebarOpen"
      [class.w-20]="!isSidebarOpen"
      style="background: linear-gradient(180deg, #1e80a3 0%, #155a7a 100%); color: white"
    >
      <nav class="h-full overflow-y-auto py-6 flex flex-col">
        <!-- Top Content -->
        <div class="flex-1">
          <div class="mb-6" [class.px-4]="isSidebarOpen" [class.px-2]="!isSidebarOpen">
            <div class="sidebar-brand" [class.sidebar-brand-collapsed]="!isSidebarOpen">
              <div *ngIf="!isSidebarOpen" class="sidebar-logo-glow">
                <img
                  src="assets/cresen_bg_removed.png"
                  alt="Company Logo"
                  class="sidebar-logo sidebar-logo-collapsed"
                />
              </div>
              <img
                *ngIf="isSidebarOpen"
                src="assets/complete_cs_logo_bg_removed.png"
                alt="Company Logo"
                class="sidebar-logo sidebar-logo-expanded"
              />
            </div>
          </div>

          <!-- Overview Menu -->
          <div class="mb-4" [class.px-4]="isSidebarOpen" [class.px-2]="!isSidebarOpen">
            <button
              (click)="toggleMenu('overview')"
              class="sidebar-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition duration-200 group hover:bg-yellow-500 hover:bg-opacity-20"
              [class.active-sidebar-item]="currentPage === 'overview'"
              [class.sidebar-nav-btn-collapsed]="!isSidebarOpen"
            >
              <span class="material-icons shrink-0 text-white" style="font-size: 28px"> home </span>
              <span
                class="font-medium transition duration-200 text-white"
                [class.hidden]="!isSidebarOpen"
              >
                Overview
              </span>
            </button>
            <div
              class="sidebar-separator"
              [class.px-4]="isSidebarOpen"
              [class.px-2]="!isSidebarOpen"
            ></div>
          </div>

          <!-- User Management Menu -->
          <div class="mb-4" [class.px-4]="isSidebarOpen" [class.px-2]="!isSidebarOpen">
            <button
              (click)="toggleMenu('users')"
              class="sidebar-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition duration-200 group hover:bg-yellow-500 hover:bg-opacity-20"
              [class.active-sidebar-item]="currentPage === 'users'"
              [class.sidebar-nav-btn-collapsed]="!isSidebarOpen"
            >
              <span class="material-icons shrink-0 text-white" style="font-size: 28px">
                people
              </span>
              <span
                class="font-medium transition duration-200 text-white"
                [class.hidden]="!isSidebarOpen"
              >
                User Management
              </span>
            </button>
            <div
              class="sidebar-separator"
              [class.px-4]="isSidebarOpen"
              [class.px-2]="!isSidebarOpen"
            ></div>
          </div>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto min-h-0">
      <div class="max-w-full admin-content-card rounded-xl md:rounded-2xl p-4 md:p-6">
        <div *ngIf="currentPage === 'overview'" class="overview-section">
          <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Welcome, {{ fullName }}!</h1>
        </div>

        <div *ngIf="currentPage === 'users'" class="user-management-section">
          <div class="user-management-header mb-2">
            <h2 class="text-2xl md:text-3xl font-bold text-slate-900 text-center">
              User Management
            </h2>
            <div class="flex justify-end mt-3">
              <button
                type="button"
                (click)="openAddEmployeeForm()"
                class="inline-flex items-center gap-2 whitespace-nowrap px-4 py-1 rounded-lg text-white font-semibold shadow-sm hover:shadow-md transition duration-200"
                style="background: linear-gradient(135deg, #1e80a3 0%, #155a7a 100%)"
              >
                <span class="material-icons text-[20px] leading-none">person_add</span>
                <span>Add Employee</span>
              </button>
            </div>
          </div>

          <div
            *ngIf="!isUsersLoaded"
            class="text-center py-10 border border-gray-200 rounded-lg bg-white"
          >
            <h3 class="text-lg font-semibold text-slate-800 mb-1">Loading Employees...</h3>
            <p class="text-slate-500 text-sm">Fetching users from server</p>
          </div>

          <div
            *ngIf="isUsersLoaded && rowData.length > 0"
            class="ag-theme-alpine user-grid-wrapper user-grid-full"
          >
            <ag-grid-angular
              class="w-full h-full"
              [rowData]="rowData"
              [columnDefs]="colDefs"
              [defaultColDef]="defaultColDef"
              [rowHeight]="52"
              [headerHeight]="54"
              [pagination]="true"
              [paginationPageSize]="5"
              [paginationPageSizeSelector]="pageSizeOptions"
              (gridReady)="onGridReady($event)"
            >
            </ag-grid-angular>
          </div>

          <div
            *ngIf="isUsersLoaded && rowData.length === 0"
            class="text-center py-10 border border-dashed border-gray-300 rounded-lg bg-white"
          >
            <h3 class="text-lg font-semibold text-slate-800 mb-1">No Employees Yet</h3>
            <p class="text-slate-500 text-sm">Add your first employee to get started.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div *ngIf="showAddEmployeeForm" class="popup-overlay" (click)="closeAddEmployeeForm()">
    <div
      class="popup-card user-form-card rounded-xl md:rounded-2xl shadow-sm p-4 md:p-8 border border-gray-200 bg-white"
      (click)="$event.stopPropagation()"
    >
      <h2 class="text-xl md:text-2xl font-bold text-slate-900 mb-5">Add New Employee</h2>
      <form
        (ngSubmit)="submitUserForm()"
        #userMgmtForm="ngForm"
        class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-5"
      >
        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Company ID <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            name="companyId"
            [(ngModel)]="userForm.companyId"
            placeholder="Enter company ID"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          />
        </div>

        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Full Name <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            name="employeeFullName"
            [(ngModel)]="userForm.fullName"
            placeholder="Enter full name"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          />
        </div>

        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Username <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            name="userName"
            [(ngModel)]="userForm.username"
            placeholder="Enter username"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          />
        </div>

        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Password <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            name="userPassword"
            [(ngModel)]="userForm.password"
            placeholder="Enter password"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          />
        </div>

        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Email <span class="text-red-500">*</span></label
          >
          <input
            type="email"
            name="userEmail"
            [(ngModel)]="userForm.email"
            placeholder="Enter email"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          />
        </div>

        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Role <span class="text-red-500">*</span></label
          >
          <select
            name="userRoleSelect"
            [(ngModel)]="userForm.role"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          >
            <option value="ADMIN">ADMIN</option>
            <option value="MANAGER">MANAGER</option>
            <option value="EMPLOYEE">EMPLOYEE</option>
          </select>
        </div>

        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Gender <span class="text-red-500">*</span></label
          >
          <select
            name="userGender"
            [(ngModel)]="userForm.gender"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          >
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs md:text-sm font-semibold text-black mb-2"
            >Status <span class="text-red-500">*</span></label
          >
          <select
            name="userStatus"
            [(ngModel)]="userForm.isActive"
            class="w-full rounded-lg md:rounded-xl border border-gray-300 px-3 md:px-4 py-2 md:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-500"
            required
          >
            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Not Active</option>
          </select>
        </div>

        <div class="md:col-span-2 pt-2 flex flex-col md:flex-row justify-center gap-2 md:gap-4">
          <button
            type="submit"
            [disabled]="userMgmtForm.invalid"
            class="w-full md:w-auto px-4 md:px-8 py-2 md:py-3 rounded-lg md:rounded-xl text-white font-semibold shadow-lg transition duration-200 enabled:hover:shadow-xl disabled:opacity-60 disabled:cursor-not-allowed text-sm"
            style="background: linear-gradient(135deg, #1e80a3 0%, #155a7a 100%)"
          >
            Save Employee
          </button>
          <button
            type="button"
            (click)="resetForm(userMgmtForm)"
            class="w-full md:w-auto px-4 md:px-8 py-2 md:py-3 rounded-lg md:rounded-xl text-white font-semibold shadow-lg transition duration-200 hover:shadow-xl text-sm"
            style="background: linear-gradient(135deg, #1e80a3 0%, #155a7a 100%)"
          >
            Reset Form
          </button>
          <button
            type="button"
            (click)="closeAddEmployeeForm()"
            class="w-full md:w-auto px-4 md:px-8 py-2 md:py-3 rounded-lg md:rounded-xl text-slate-700 font-semibold border border-gray-300 transition duration-200 hover:bg-gray-50 text-sm"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
